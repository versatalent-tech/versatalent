name: End-to-end tests

# Runs the Playwright tests against a temporary copy of the database (see
# e2e/README.md). Needs the NEON_API_KEY repository secret; without it (for
# example on pull requests from forks) the tests are skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: snowy-tooth-29200550
      CI: 'true'
    steps:
      - name: Check the Neon API key is available
        id: key
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY isn't set for this run, so the tests are skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.key.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Install the test browser
        if: steps.key.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Type-check the tests
        if: steps.key.outputs.ready == 'true'
        run: npm run test:e2e:typecheck

      # No screenshots, traces or reports are uploaded: the test database is a
      # copy of live data and this repository is public
      - name: Run the tests
        if: steps.key.outputs.ready == 'true'
        run: npm run test:e2e
