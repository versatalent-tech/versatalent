<!DOCTYPE html>
<html>
<head><title>Form Registration</title></head>
<body>
  <!-- General Contact Form -->
  <form name="versatalent-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="hidden" name="form-name" value="versatalent-contact" />
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
  </form>

  <!-- Talent Application Form -->
  <form name="versatalent-talent" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="hidden" name="form-name" value="versatalent-talent" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="industry" />
    <textarea name="experience"></textarea>
    <input type="url" name="portfolioLink" />
    <textarea name="message"></textarea>
  </form>

  <!-- Brand Partnership Form -->
  <form name="versatalent-brand" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="hidden" name="form-name" value="versatalent-brand" />
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="company" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
  </form>
  <!-- Booking enquiry about one talent (talent pages and card taps) -->
  <form name="versatalent-booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="hidden" name="form-name" value="versatalent-booking" />
    <input type="hidden" name="talentId" />
    <input type="text" name="talentName" />
    <input type="hidden" name="source" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="company" />
    <input type="text" name="eventDate" />
    <input type="text" name="eventDetails" />
    <textarea name="message"></textarea>
    <input type="checkbox" name="marketingConsent" value="yes" />
  </form>
</body>
</html>
